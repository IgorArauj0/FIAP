<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Contador Dinâmico</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="contador">
        <p class="etiqueta">CONTADOR DINÂMICO</p>
        <h1 id="titulo">Acompanhe sua contagem</h1>
        <p class="descricao">Use os controles para ajustar o valor.</p>

        <span id="numero" class="numero">0</span>

        <div class="controles">
            <button class="botao-diminuir" type="button" onclick="diminuirContador()">-</button>
            
            <button class="botao-aumentar" type="button" onclick="aumentarContador()">+</button>

        </div>
        
    </main>


</body>

</html>
