<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Contador Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contador" aria-labelledby="titulo">
        <p class="etiqueta">CONTADOR DINÂMICO</p>
        <h1 id="titulo">Acompanhe sua contagem</h1>
        <p class="descricao">Use os controles para ajustar o valor.</p>

        <output id="numero" class="numero" aria-live="polite">0</output>

        <div class="controles" aria-label="Controles do contador">
            <button class="botao botao-diminuir" type="button" onclick="diminuir()"
                aria-label="Diminuir contador">−</button>
            <button class="botao botao-aumentar" type="button" onclick="aumentar()"
                aria-label="Aumentar contador">+</button>
        </div>
    </main>

    <script>
        let contador = 0;

        function aumentar() {
            contador++;
            document.getElementById("numero").innerText = contador;
        }

        function diminuir() {
            contador--;
            document.getElementById("numero").innerText = contador;
        }
    </script>
</body>

</html>
